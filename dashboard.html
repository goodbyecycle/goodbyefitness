<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<title>Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--text:#e4e4e4;--accent:#3b82f6;
  --card:#111113;--border:#1e1e22;--muted:#888;
  --green:#22c55e;--red:#ef4444;--yellow:#eab308;
  --orange:#f97316;
}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;
}

/* ── Top bar ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 1rem;border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.topbar .day{font-weight:700;font-size:1rem}
.topbar .date{color:var(--muted);font-size:.8rem}
.topbar-right{display:flex;align-items:center;gap:.75rem}
.topbar-btn{
  color:var(--muted);text-decoration:none;font-size:.8rem;
  padding:4px 10px;border:1px solid var(--border);border-radius:6px;
  background:none;cursor:pointer;
}
.topbar-btn:hover{color:var(--text);border-color:#333}

/* ── Calendar (top half) ── */
.calendar-section{
  flex:1;min-height:0;display:flex;flex-direction:column;
  border-bottom:1px solid var(--border);
}
.calendar-section iframe{
  flex:1;width:100%;border:none;background:#111;
}
.calendar-placeholder{
  flex:1;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:.9rem;padding:2rem;text-align:center;
}

/* ── Bottom half: tabs ── */
.bottom-section{
  flex:1;min-height:0;display:flex;flex-direction:column;
}
.tabs{
  display:flex;border-bottom:1px solid var(--border);flex-shrink:0;
}
.tab{
  flex:1;padding:.6rem;text-align:center;font-size:.8rem;font-weight:600;
  color:var(--muted);background:none;border:none;cursor:pointer;
  border-bottom:2px solid transparent;
}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.tab-content{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── Reminders / Todos ── */
.item{
  display:flex;align-items:center;gap:.6rem;
  padding:.7rem 1rem;border-bottom:1px solid var(--border);
}
.item:last-child{border-bottom:none}
.item.done .item-text{text-decoration:line-through;color:var(--muted)}
.item input[type=checkbox]{
  width:20px;height:20px;accent-color:var(--green);cursor:pointer;flex-shrink:0;
}
.item-text{flex:1;font-size:.9rem}
.item-sub{color:var(--muted);font-size:.75rem}
.item-link{
  color:var(--accent);text-decoration:none;font-size:.75rem;
  background:rgba(59,130,246,.1);padding:2px 8px;border-radius:5px;
}
.item-delete{
  background:none;border:none;color:#444;cursor:pointer;font-size:1rem;padding:0 2px;
}
.item-delete:hover{color:var(--red)}
.day-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
}
.day-dot.today{background:var(--yellow)}
.day-dot.other{background:#333}

.empty{color:var(--muted);font-size:.85rem;padding:2rem;text-align:center}

/* ── Nicki ── */
.nicki-item{
  padding:.75rem 1rem;border-bottom:1px solid var(--border);
}
.nicki-row{display:flex;gap:.4rem;margin-top:.4rem;flex-wrap:wrap}
.nicki-btn{
  padding:.4rem .8rem;border:none;border-radius:6px;
  font-size:.75rem;font-weight:600;cursor:pointer;color:#fff;
}
.nicki-btn.review{background:var(--green)}
.nicki-btn.social{background:var(--orange)}
.nicki-input{
  flex:1;min-width:100px;padding:.4rem .6rem;background:#1a1a1e;
  border:1px solid #2a2a2e;border-radius:6px;color:#fff;font-size:.8rem;outline:none;
}
.nicki-status{color:var(--muted);font-size:.75rem;margin-top:.3rem}

/* ── Quick links ── */
.links-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--border);
}
.quick-link{
  display:flex;flex-direction:column;align-items:center;gap:.2rem;
  padding:.75rem .25rem;background:var(--card);
  text-decoration:none;color:var(--text);font-size:.7rem;text-align:center;
}
.quick-link:active{background:#1a1a1e}
.quick-link .icon{font-size:1.3rem}

/* ── Add bar (floating) ── */
.add-bar{
  display:flex;gap:.4rem;padding:.5rem .75rem;
  border-top:1px solid var(--border);background:var(--bg);flex-shrink:0;
}
.add-bar input,.add-bar select{
  padding:.45rem .6rem;background:#1a1a1e;border:1px solid #2a2a2e;
  border-radius:8px;color:#fff;font-size:.85rem;outline:none;
}
.add-bar input:focus{border-color:var(--accent)}
.add-bar input[name=text]{flex:2;min-width:0}
.add-bar input[name=link]{flex:1;min-width:0}
.add-bar select{flex:0 0 auto;max-width:90px}
.add-bar button{
  padding:.45rem .7rem;background:var(--accent);color:#fff;border:none;
  border-radius:8px;font-weight:700;font-size:.85rem;cursor:pointer;
  flex-shrink:0;
}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div>
    <div class="day" id="dayName"></div>
    <div class="date" id="dateFull"></div>
  </div>
  <div class="topbar-right">
    <a href="/dashboard/logout" class="topbar-btn">Log out</a>
  </div>
</div>

<!-- Calendar top half -->
<div class="calendar-section">
  <iframe id="calendarEmbed" src="" style="display:none" loading="lazy"></iframe>
  <div class="calendar-placeholder" id="calendarPlaceholder">Loading calendar...</div>
</div>

<!-- Bottom half -->
<div class="bottom-section">
  <div class="tabs">
    <button class="tab active" data-tab="reminders">Reminders</button>
    <button class="tab" data-tab="todos">To-Do</button>
    <button class="tab" data-tab="nicki">Nicki</button>
    <button class="tab" data-tab="links">Links</button>
  </div>

  <div class="tab-content">
    <!-- Reminders tab -->
    <div class="tab-panel active" id="panel-reminders">
      <div id="reminderList"></div>
    </div>

    <!-- To-Do tab -->
    <div class="tab-panel" id="panel-todos">
      <div id="todoList"></div>
    </div>

    <!-- Nicki tab -->
    <div class="tab-panel" id="panel-nicki">
      <div class="nicki-item">
        <div style="font-weight:600;font-size:.9rem">Google Review Reminder</div>
        <div class="nicki-row">
          <input type="text" class="nicki-input" id="nickiCustomer" placeholder="Customer name">
          <button class="nicki-btn review" onclick="nudgeNicki('review')">Send</button>
        </div>
        <div class="nicki-status" id="nickiReviewStatus"></div>
      </div>
      <div class="nicki-item">
        <div style="font-weight:600;font-size:.9rem">Social Media Check</div>
        <div style="color:var(--muted);font-size:.8rem;margin:.3rem 0">Ask Nicki if this week's RG Seamless post went up</div>
        <button class="nicki-btn social" onclick="nudgeNicki('social')">Send Check</button>
        <div class="nicki-status" id="nickiSocialStatus"></div>
      </div>
    </div>

    <!-- Links tab -->
    <div class="tab-panel" id="panel-links">
      <div class="links-grid">
        <a class="quick-link" href="https://mail.google.com" target="_blank">
          <span class="icon">&#9993;</span>Gmail
        </a>
        <a class="quick-link" href="https://calendar.google.com" target="_blank">
          <span class="icon">&#128197;</span>Calendar
        </a>
        <a class="quick-link" href="https://app.getjobber.com" target="_blank">
          <span class="icon">&#128736;</span>Jobber
        </a>
        <a class="quick-link" href="https://drive.google.com" target="_blank">
          <span class="icon">&#128193;</span>Drive
        </a>
        <a class="quick-link" href="https://www.facebook.com" target="_blank">
          <span class="icon">f</span>Facebook
        </a>
        <a class="quick-link" href="https://www.instagram.com" target="_blank">
          <span class="icon">&#128247;</span>Instagram
        </a>
        <a class="quick-link" id="googleReviewLink" href="#" target="_blank">
          <span class="icon">&#11088;</span>Reviews
        </a>
        <a class="quick-link" href="https://business.google.com" target="_blank">
          <span class="icon">&#127970;</span>Business
        </a>
      </div>
    </div>
  </div>

  <!-- Add bar at bottom -->
  <form class="add-bar" id="addForm">
    <input name="text" placeholder="Add reminder or to-do..." required>
    <input name="link" placeholder="Link" style="display:none" id="addLink">
    <select name="type" id="addType">
      <option value="todo">To-Do</option>
      <option value="reminder" selected>Reminder</option>
    </select>
    <select name="day" id="addDay" style="display:none">
      <option value="daily">Daily</option>
      <option value="monday">Mon</option>
      <option value="tuesday">Tue</option>
      <option value="wednesday">Wed</option>
      <option value="thursday">Thu</option>
      <option value="friday">Fri</option>
      <option value="saturday">Sat</option>
      <option value="sunday">Sun</option>
    </select>
    <button type="submit">+</button>
  </form>
</div>

<script>
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const DAY_LABELS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat','Daily'];
const TODAY = DAYS[new Date().getDay()];
const now = new Date();
document.getElementById('dayName').textContent = now.toLocaleDateString('en-US',{weekday:'long'});
document.getElementById('dateFull').textContent = now.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

// ── Tabs ──
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  };
});

// ── Add type toggle ──
const addType = document.getElementById('addType');
const addDay = document.getElementById('addDay');
addType.onchange = () => {
  addDay.style.display = addType.value === 'reminder' ? '' : 'none';
};
addType.dispatchEvent(new Event('change'));

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: {'Content-Type': 'application/json'},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) { location.href = '/dashboard/login'; return null; }
  return res.json();
}

// ── Reminders ──
let reminders = [];
async function loadReminders() {
  reminders = await api('/api/dashboard/reminders') || [];
  renderReminders();
}

function renderReminders() {
  const el = document.getElementById('reminderList');
  const todayFirst = reminders.filter(r => r.day === TODAY || r.day === 'daily');
  const rest = reminders.filter(r => r.day !== TODAY && r.day !== 'daily');
  const sorted = [...todayFirst, ...rest];

  if (!sorted.length) {
    el.innerHTML = '<div class="empty">No reminders yet</div>';
    document.querySelector('[data-tab="reminders"]').textContent = 'Reminders';
    return;
  }
  const todayCount = todayFirst.length;
  document.querySelector('[data-tab="reminders"]').textContent =
    todayCount > 0 ? `Reminders (${todayCount})` : 'Reminders';

  el.innerHTML = sorted.map(r => {
    const isToday = r.day === TODAY || r.day === 'daily';
    return `
    <div class="item">
      <span class="day-dot ${isToday ? 'today' : 'other'}"></span>
      <div style="flex:1;min-width:0">
        <div class="item-text">${esc(r.text)}</div>
        <div class="item-sub">${r.day === 'daily' ? 'Every day' : capitalize(r.day)}${isToday ? ' &mdash; TODAY' : ''}</div>
      </div>
      ${r.link ? `<a href="${esc(r.link)}" target="_blank" class="item-link">Open</a>` : ''}
      <button class="item-delete" onclick="deleteReminder('${r.id}')">&times;</button>
    </div>`;
  }).join('');
}

async function deleteReminder(id) {
  await api(`/api/dashboard/reminders/${id}`, { method: 'DELETE' });
  loadReminders();
}

// ── To-Dos ──
let todos = [];
async function loadTodos() {
  todos = await api('/api/dashboard/todos') || [];
  renderTodos();
}

function renderTodos() {
  const el = document.getElementById('todoList');
  const pending = todos.filter(t => !t.done);
  const done = todos.filter(t => t.done);
  const sorted = [...pending, ...done];
  const tab = document.querySelector('[data-tab="todos"]');
  tab.textContent = pending.length > 0 ? `To-Do (${pending.length})` : 'To-Do';

  if (!sorted.length) {
    el.innerHTML = '<div class="empty">No to-dos yet</div>';
    return;
  }
  el.innerHTML = sorted.map(t => `
    <div class="item ${t.done ? 'done' : ''}">
      <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo('${t.id}',this.checked)">
      <span class="item-text">${esc(t.text)}</span>
      ${t.link ? `<a href="${esc(t.link)}" target="_blank" class="item-link">Open</a>` : ''}
      <button class="item-delete" onclick="deleteTodo('${t.id}')">&times;</button>
    </div>
  `).join('');
}

async function toggleTodo(id, done) {
  await api(`/api/dashboard/todos/${id}`, { method: 'PATCH', body: { done } });
  loadTodos();
}
async function deleteTodo(id) {
  await api(`/api/dashboard/todos/${id}`, { method: 'DELETE' });
  loadTodos();
}

// ── Add form ──
document.getElementById('addForm').onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const type = f.get('type');
  if (type === 'reminder') {
    await api('/api/dashboard/reminders', {
      method: 'POST',
      body: { text: f.get('text'), link: f.get('link') || '', day: f.get('day') },
    });
    loadReminders();
    document.querySelector('[data-tab="reminders"]').click();
  } else {
    await api('/api/dashboard/todos', {
      method: 'POST',
      body: { text: f.get('text'), link: f.get('link') || '' },
    });
    loadTodos();
    document.querySelector('[data-tab="todos"]').click();
  }
  e.target.reset();
  addType.dispatchEvent(new Event('change'));
};

// ── Nicki ──
async function nudgeNicki(type) {
  const statusEl = document.getElementById(type === 'review' ? 'nickiReviewStatus' : 'nickiSocialStatus');
  const customer = document.getElementById('nickiCustomer').value.trim();
  if (type === 'review' && !customer) {
    statusEl.textContent = 'Enter customer name'; statusEl.style.color='var(--yellow)'; return;
  }
  statusEl.textContent = 'Sending...'; statusEl.style.color='var(--muted)';
  const res = await api('/api/dashboard/nudge-nicki', { method:'POST', body:{type,customer} });
  if (res?.ok) {
    statusEl.textContent = 'Sent!'; statusEl.style.color='var(--green)';
    if (type==='review') document.getElementById('nickiCustomer').value='';
  } else {
    statusEl.textContent = res?.error || 'Failed'; statusEl.style.color='var(--red)';
  }
}

// ── Calendar ──
async function loadCalendar() {
  const res = await api('/api/dashboard/config');
  if (res?.google_calendar_id) {
    const src = `https://calendar.google.com/calendar/embed?src=${encodeURIComponent(res.google_calendar_id)}&ctz=America/Detroit&mode=AGENDA&showTitle=0&showNav=1&showPrint=0&showTabs=0&showCalendars=0&bgcolor=%230a0a0a&color=%233b82f6`;
    document.getElementById('calendarEmbed').src = src;
    document.getElementById('calendarEmbed').style.display = 'block';
    document.getElementById('calendarPlaceholder').style.display = 'none';
  } else {
    document.getElementById('calendarPlaceholder').textContent = 'Set GOOGLE_CALENDAR_ID on Render';
  }
  if (res?.google_review_url) {
    document.getElementById('googleReviewLink').href = res.google_review_url;
  }
}

function capitalize(s) { return s ? s[0].toUpperCase() + s.slice(1) : ''; }
function esc(s) { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

loadReminders();
loadTodos();
loadCalendar();
</script>
</body>
</html>
