<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Andrew's Training Dashboard</title>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue-bg: #4F9DFF;
  --blue-light: #6BB3FF;
  --pink: #FF4FA3;
  --pink-light: rgba(255, 79, 163, 0.3);
  --black: #000000;
  --white: #FFFFFF;
  --muted: rgba(0, 0, 0, 0.35);
  --today-bg: #FF4FA3;
  --today-text: #000000;
  --cell-hover: rgba(255, 255, 255, 0.12);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
}

html, body {
  height: 100%;
  font-family: var(--font);
  background: var(--blue-bg);
  color: var(--black);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 24px 24px 40px;
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
}

.dashboard-header { text-align: center; margin-bottom: 24px; }
.brand-title { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; }
.page-title { font-size: 1.1rem; font-weight: 500; margin-top: 4px; opacity: 0.8; }

.calendar-controls { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 20px; }
.view-selector { display: flex; gap: 8px; }

.view-btn {
  font-family: var(--font); font-size: 0.95rem; font-weight: 600;
  padding: 10px 22px; border: 2px solid var(--pink); border-radius: 12px;
  background: transparent; color: var(--black); cursor: pointer;
  transition: background 0.15s, color 0.15s; -webkit-tap-highlight-color: transparent;
}
.view-btn:hover { background: var(--pink-light); }
.view-btn.active { background: var(--pink); color: var(--white); }

.calendar-nav { display: flex; align-items: center; gap: 10px; }

.nav-btn {
  font-family: var(--font); font-size: 1.2rem; font-weight: 700;
  width: 44px; height: 44px; border: 2px solid var(--pink); border-radius: 12px;
  background: transparent; color: var(--black); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s; -webkit-tap-highlight-color: transparent;
}
.nav-btn:hover { background: var(--pink-light); }
.today-btn { width: auto; padding: 0 20px; font-size: 0.95rem; }
.nav-label { font-size: 1.15rem; font-weight: 700; margin-left: 8px; white-space: nowrap; }

.calendar-container { background: var(--blue-light); border: 2px solid var(--pink); border-radius: 16px; overflow: hidden; }

.month-grid { display: grid; grid-template-columns: repeat(7, 1fr); width: 100%; }

.weekday-header {
  text-align: center; font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; padding: 12px 4px; border-bottom: 2px solid var(--pink);
  border-right: 1px solid var(--pink);
}
.weekday-header:last-child { border-right: none; }

.month-cell {
  min-height: 100px; padding: 8px; border-bottom: 1px solid var(--pink);
  border-right: 1px solid var(--pink); cursor: pointer; transition: background 0.12s;
}
.month-cell:nth-child(7n) { border-right: none; }
.month-cell:hover { background: var(--cell-hover); }
.month-cell.outside { opacity: 0.35; }

.month-cell .date-num {
  font-size: 0.95rem; font-weight: 600; width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center; border-radius: 50%;
}
.month-cell.today .date-num { background: var(--today-bg); color: var(--today-text); font-weight: 800; }
.month-cell .event-area { margin-top: 4px; min-height: 40px; }

.week-grid { display: grid; grid-template-columns: 60px repeat(7, 1fr); width: 100%; overflow-x: auto; }
.week-header-spacer { border-bottom: 2px solid var(--pink); border-right: 1px solid var(--pink); }

.week-day-header {
  text-align: center; padding: 10px 4px; border-bottom: 2px solid var(--pink);
  border-right: 1px solid var(--pink); font-weight: 700; font-size: 0.8rem;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.week-day-header:last-child { border-right: none; }
.week-day-header .header-date { display: block; font-size: 1.3rem; margin-top: 2px; }
.week-day-header.today { background: var(--pink-light); }
.week-day-header.today .header-date {
  background: var(--today-bg); color: var(--today-text); width: 36px; height: 36px;
  border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800;
}

.week-time-label {
  font-size: 0.75rem; font-weight: 600; text-align: right; padding: 4px 8px 0 4px;
  border-right: 1px solid var(--pink); border-bottom: 1px solid var(--pink); height: 60px; opacity: 0.7;
}

.week-cell {
  border-right: 1px solid var(--pink); border-bottom: 1px solid var(--pink);
  height: 60px; cursor: pointer; transition: background 0.12s;
}
.week-cell:nth-child(8n) { border-right: none; }
.week-cell:hover { background: var(--cell-hover); }
.week-cell.today-col { background: rgba(255, 79, 163, 0.08); }

.threeday-grid { display: grid; grid-template-columns: 60px repeat(3, 1fr); width: 100%; }
.threeday-header-spacer { border-bottom: 2px solid var(--pink); border-right: 1px solid var(--pink); }

.threeday-day-header {
  text-align: center; padding: 10px 4px; border-bottom: 2px solid var(--pink);
  border-right: 1px solid var(--pink); font-weight: 700; font-size: 0.85rem; text-transform: uppercase;
}
.threeday-day-header:last-child { border-right: none; }
.threeday-day-header .header-date { display: block; font-size: 1.3rem; margin-top: 2px; }
.threeday-day-header.today { background: var(--pink-light); }
.threeday-day-header.today .header-date {
  background: var(--today-bg); color: var(--today-text); width: 36px; height: 36px;
  border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800;
}

.threeday-time-label {
  font-size: 0.75rem; font-weight: 600; text-align: right; padding: 4px 8px 0 4px;
  border-right: 1px solid var(--pink); border-bottom: 1px solid var(--pink); height: 60px; opacity: 0.7;
}

.threeday-cell {
  border-right: 1px solid var(--pink); border-bottom: 1px solid var(--pink);
  height: 60px; cursor: pointer; transition: background 0.12s;
}
.threeday-cell:nth-child(4n) { border-right: none; }
.threeday-cell:hover { background: var(--cell-hover); }
.threeday-cell.today-col { background: rgba(255, 79, 163, 0.08); }

.day-view { width: 100%; }
.day-view-header { text-align: center; padding: 16px; border-bottom: 2px solid var(--pink); font-weight: 700; font-size: 1.1rem; }
.day-view-header.today { background: var(--pink-light); }
.day-view-header .header-date { font-size: 2rem; display: block; margin-top: 4px; }
.day-view-header.today .header-date {
  background: var(--today-bg); color: var(--today-text); width: 52px; height: 52px;
  border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800;
}

.day-hour-row { display: grid; grid-template-columns: 70px 1fr; border-bottom: 1px solid var(--pink); min-height: 60px; }
.day-time-label { font-size: 0.8rem; font-weight: 600; text-align: right; padding: 6px 12px 0 4px; border-right: 1px solid var(--pink); opacity: 0.7; }
.day-hour-cell { min-height: 60px; padding: 4px 8px; }

@media (max-width: 768px) {
  #app { padding: 16px 12px 32px; }
  .brand-title { font-size: 1.5rem; }
  .page-title { font-size: 0.95rem; }
  .view-selector { gap: 6px; }
  .view-btn { padding: 8px 14px; font-size: 0.85rem; border-radius: 10px; }
  .nav-btn { width: 40px; height: 40px; }
  .nav-label { font-size: 1rem; }
  .month-cell { min-height: 70px; padding: 4px; }
  .month-cell .date-num { font-size: 0.85rem; width: 28px; height: 28px; }
  .weekday-header { font-size: 0.65rem; padding: 8px 2px; }
  .week-grid { min-width: 700px; }
  .calendar-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
}

@media (max-width: 480px) {
  .brand-title { font-size: 1.3rem; }
  .view-selector { flex-wrap: wrap; justify-content: center; }
  .view-btn { padding: 8px 12px; font-size: 0.8rem; }
  .month-cell { min-height: 55px; }
  .threeday-grid { display: flex; flex-direction: column; }
  .threeday-header-spacer { display: none; }
  .threeday-day-header { border-right: none; }
  .threeday-time-label { width: 60px; display: inline-block; border-right: 1px solid var(--pink); }
  .threeday-stack-day { border-bottom: 3px solid var(--pink); }
  .threeday-stack-day:last-child { border-bottom: none; }
  .threeday-stack-row { display: grid; grid-template-columns: 60px 1fr; border-bottom: 1px solid var(--pink); min-height: 60px; }
  .threeday-stack-cell { min-height: 60px; }
}

/* ── Recommend Button ── */
.recommend-bar { text-align: center; margin-bottom: 16px; }
.recommend-btn {
  font-family: var(--font); font-size: 1rem; font-weight: 700;
  padding: 12px 28px; border: 2px solid var(--pink); border-radius: 12px;
  background: var(--pink); color: var(--white); cursor: pointer;
  transition: opacity 0.15s; -webkit-tap-highlight-color: transparent;
}
.recommend-btn:hover { opacity: 0.85; }
.recommend-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── Modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 1000; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--blue-light); border: 2px solid var(--pink); border-radius: 16px;
  padding: 24px; max-width: 500px; width: 90%; max-height: 85vh; overflow-y: auto;
}
.modal h3 { font-size: 1.2rem; margin-bottom: 12px; }
.modal-row { margin-bottom: 8px; font-size: 0.9rem; }
.modal-row strong { display: inline-block; min-width: 80px; }
.modal-trail { margin-top: 10px; padding: 10px; background: rgba(255,255,255,0.15); border-radius: 8px; font-size: 0.85rem; }
.modal-trail .trail-status { font-weight: 700; text-transform: uppercase; font-size: 0.75rem; }
.modal-trail .trail-status.open { color: #0a8a0a; }
.modal-trail .trail-status.unknown { color: #b8860b; }
.modal-explanation { margin-top: 10px; font-size: 0.85rem; font-style: italic; opacity: 0.8; }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; }
.modal-actions button {
  flex: 1; font-family: var(--font); font-size: 0.95rem; font-weight: 600;
  padding: 10px 16px; border: 2px solid var(--pink); border-radius: 10px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.modal-accept { background: var(--pink); color: var(--white); }
.modal-cancel { background: transparent; color: var(--black); }
.modal-error { color: #c00; font-weight: 600; text-align: center; padding: 16px; }
.modal-instructions { margin-top: 10px; font-size: 0.85rem; }
.modal-instructions ol { padding-left: 20px; margin-top: 4px; }
.modal-instructions li { margin-bottom: 4px; }
.modal-source { margin-top: 8px; font-size: 0.75rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.5px; }
.modal-delete { background: transparent; color: #c00; border-color: #c00; }
.modal-delete:hover { background: rgba(204,0,0,0.1); }
.modal-edit { background: transparent; color: var(--black); }

/* ── Workout Card ── */
.workout-card {
  background: var(--pink); color: var(--white); border-radius: 6px;
  padding: 3px 5px; font-size: 0.7rem; line-height: 1.3; margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; cursor: pointer;
}
.workout-card .wc-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.workout-card .wc-meta { opacity: 0.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.day-workout-card {
  background: var(--pink); color: var(--white); border-radius: 8px;
  padding: 10px 14px; margin: 8px; font-size: 0.85rem; cursor: pointer;
}
.day-workout-card .wc-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
.day-workout-card .wc-meta { opacity: 0.9; }

.week-workout-card, .threeday-workout-card {
  background: var(--pink); color: var(--white); border-radius: 5px;
  padding: 2px 4px; font-size: 0.65rem; line-height: 1.25; margin: 1px 2px;
  overflow: hidden; cursor: pointer;
}
.week-workout-card .wc-title, .threeday-workout-card .wc-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── Check-In Form ── */
.checkin-btn {
  font-family: var(--font); font-size: 1rem; font-weight: 700;
  padding: 12px 28px; border: 2px solid var(--pink); border-radius: 12px;
  background: transparent; color: var(--black); cursor: pointer;
  transition: background 0.15s, opacity 0.15s; -webkit-tap-highlight-color: transparent;
  margin-right: 10px;
}
.checkin-btn:hover { background: var(--pink-light); }
.checkin-btn.done { background: rgba(10,138,10,0.15); border-color: #0a8a0a; color: #0a8a0a; cursor: default; }

.checkin-form label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; margin-top: 12px; }
.checkin-form label:first-child { margin-top: 0; }
.checkin-form input[type="range"] { width: 100%; accent-color: var(--pink); }
.checkin-form .range-row { display: flex; align-items: center; gap: 8px; }
.checkin-form .range-val { font-weight: 700; min-width: 24px; text-align: center; }
.checkin-form .range-labels { display: flex; justify-content: space-between; font-size: 0.7rem; opacity: 0.6; margin-top: -2px; }
.checkin-form input[type="number"], .checkin-form input[type="text"], .checkin-form select, .checkin-form textarea {
  width: 100%; font-family: var(--font); font-size: 0.9rem; padding: 8px 10px;
  border: 2px solid var(--pink); border-radius: 8px; background: rgba(255,255,255,0.2);
  color: var(--black); outline: none;
}
.checkin-form textarea { resize: vertical; min-height: 50px; }
.checkin-form .field-error { color: #c00; font-size: 0.75rem; font-weight: 600; margin-top: 2px; display: none; }
.checkin-form .field-error.visible { display: block; }

/* ── Readiness Summary ── */
.readiness-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px; }
.readiness-summary {
  background: rgba(255,255,255,0.2); border: 2px solid var(--pink); border-radius: 12px;
  padding: 10px 18px; font-size: 0.85rem; text-align: center; max-width: 420px;
}
.readiness-summary .rs-score { font-size: 1.5rem; font-weight: 800; }
.readiness-summary .rs-label { font-weight: 600; margin-left: 6px; }
.readiness-summary .rs-date { font-size: 0.75rem; opacity: 0.6; margin-top: 2px; }
.readiness-summary .rs-warning { font-size: 0.8rem; color: #c00; font-weight: 600; margin-top: 4px; }

.checkin-gate { text-align: center; font-size: 0.85rem; font-weight: 600; color: #555; padding: 6px 0; }

/* ── Health Score Button ── */
.health-score-btn {
  font-family: var(--font); font-size: 0.9rem; font-weight: 700;
  padding: 10px 20px; border: 2px solid var(--pink); border-radius: 12px;
  background: var(--pink); color: var(--white); cursor: pointer;
  transition: opacity 0.15s; -webkit-tap-highlight-color: transparent;
}
.health-score-btn:hover { opacity: 0.85; }
.health-score-btn.done { background: rgba(10,138,10,0.15); border-color: #0a8a0a; color: #0a8a0a; cursor: pointer; }

/* ── Athlytic Health Summary ── */
.health-summary {
  background: rgba(255,255,255,0.15); border: 1px solid var(--pink); border-radius: 10px;
  padding: 8px 16px; font-size: 0.85rem; text-align: center; max-width: 420px; margin-top: 4px; cursor: pointer;
}
.health-summary:hover { background: rgba(255,255,255,0.25); }
.health-summary .hs-label { font-weight: 700; }
.health-summary .hs-date { font-size: 0.75rem; opacity: 0.6; margin-top: 2px; }

/* ── Health Form Fields ── */
.health-form label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; margin-top: 12px; }
.health-form label:first-child { margin-top: 0; }
.health-form input[type="number"], .health-form input[type="date"], .health-form input[type="file"] {
  width: 100%; font-family: var(--font); font-size: 0.9rem; padding: 8px 10px;
  border: 2px solid var(--pink); border-radius: 8px; background: rgba(255,255,255,0.2);
  color: var(--black); outline: none;
}
.health-form .field-error { color: #c00; font-size: 0.75rem; font-weight: 600; margin-top: 2px; display: none; }
.health-form .field-error.visible { display: block; }
  </style>
</head>
<body>
  <div id="app">
    <header class="dashboard-header">
      <h1 class="brand-title">Goodbye Fitness</h1>
      <h2 class="page-title">Andrew's Training Calendar</h2>
    </header>

    <div class="calendar-controls">
      <div class="view-selector" id="viewSelector">
        <button class="view-btn active" data-view="month">Month</button>
        <button class="view-btn" data-view="week">Week</button>
        <button class="view-btn" data-view="threeday">3 Day</button>
        <button class="view-btn" data-view="day">Day</button>
      </div>

      <div class="calendar-nav">
        <button class="nav-btn" id="prevBtn" aria-label="Previous">&#8249;</button>
        <button class="nav-btn today-btn" id="todayBtn">Today</button>
        <button class="nav-btn" id="nextBtn" aria-label="Next">&#8250;</button>
        <span class="nav-label" id="navLabel"></span>
      </div>
    </div>

    <div style="text-align:left; max-width:1200px; margin-bottom:8px;">
      <button class="health-score-btn" id="healthBtn">Enter Health Score</button>
    </div>
    <div id="healthSummary"></div>

    <div class="readiness-bar">
      <button class="checkin-btn" id="checkinBtn">Morning Check-In</button>
      <button class="recommend-btn" id="recommendBtn">Get Today's Recommendation</button>
    </div>
    <div id="readinessSummary"></div>
    <div class="checkin-gate" id="checkinGate" style="display:none"></div>

    <main class="calendar-container" id="calendarContainer"></main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <script>
function localToday() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate());
}

function toDateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function addDays(d, n) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}

function startOfWeek(d) { return addDays(d, -d.getDay()); }
function endOfWeek(d) { return addDays(d, 6 - d.getDay()); }

function monthGridStart(year, month) { return startOfWeek(new Date(year, month, 1)); }
function monthGridEnd(year, month) { return endOfWeek(new Date(year, month + 1, 0)); }

function daysInRange(start, end) {
  const days = [];
  let cur = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  while (cur <= end) {
    days.push(new Date(cur.getFullYear(), cur.getMonth(), cur.getDate()));
    cur = addDays(cur, 1);
  }
  return days;
}

const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const WEEKDAYS_FULL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

function formatMonthYear(d) { return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }

function formatWeekRange(start) {
  const end = addDays(start, 6);
  if (start.getMonth() === end.getMonth()) return `${MONTHS[start.getMonth()]} ${start.getDate()}–${end.getDate()}, ${start.getFullYear()}`;
  if (start.getFullYear() === end.getFullYear()) return `${MONTHS[start.getMonth()]} ${start.getDate()} – ${MONTHS[end.getMonth()]} ${end.getDate()}, ${start.getFullYear()}`;
  return `${MONTHS[start.getMonth()]} ${start.getDate()}, ${start.getFullYear()} – ${MONTHS[end.getMonth()]} ${end.getDate()}, ${end.getFullYear()}`;
}

function formatThreeDayRange(start) {
  const end = addDays(start, 2);
  if (start.getMonth() === end.getMonth()) return `${MONTHS[start.getMonth()]} ${start.getDate()}–${end.getDate()}, ${start.getFullYear()}`;
  if (start.getFullYear() === end.getFullYear()) return `${MONTHS[start.getMonth()]} ${start.getDate()} – ${MONTHS[end.getMonth()]} ${end.getDate()}, ${start.getFullYear()}`;
  return `${MONTHS[start.getMonth()]} ${start.getDate()}, ${start.getFullYear()} – ${MONTHS[end.getMonth()]} ${end.getDate()}, ${end.getFullYear()}`;
}

function formatDayFull(d) { return `${WEEKDAYS_FULL[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }

const STORAGE_KEY = 'andrew_workouts';
function loadEvents() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } }
function saveEvents(evts) { localStorage.setItem(STORAGE_KEY, JSON.stringify(evts)); }
let events = loadEvents();
function getEventsForDate(dateKey) { return events.filter(e => e.date === dateKey); }

const state = { view: 'month', selectedDate: localToday(), today: localToday() };

const container = document.getElementById('calendarContainer');
const navLabel = document.getElementById('navLabel');
const viewBtns = document.querySelectorAll('.view-btn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const todayBtn = document.getElementById('todayBtn');

const HOUR_START = 6, HOUR_END = 21;
function formatHour(h) { if (h === 0) return '12 AM'; if (h < 12) return `${h} AM`; if (h === 12) return '12 PM'; return `${h - 12} PM`; }

function render() {
  updateNavLabel();
  updateViewButtons();
  switch (state.view) {
    case 'month': renderMonth(); break;
    case 'week': renderWeek(); break;
    case 'threeday': renderThreeDay(); break;
    case 'day': renderDay(); break;
  }
}

function updateNavLabel() {
  const d = state.selectedDate;
  switch (state.view) {
    case 'month': navLabel.textContent = formatMonthYear(d); break;
    case 'week': navLabel.textContent = formatWeekRange(startOfWeek(d)); break;
    case 'threeday': navLabel.textContent = formatThreeDayRange(d); break;
    case 'day': navLabel.textContent = formatDayFull(d); break;
  }
}

function updateViewButtons() {
  viewBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.view === state.view));
}

function dateClickHandler(dateStr) {
  const parts = dateStr.split('-');
  state.selectedDate = new Date(+parts[0], +parts[1] - 1, +parts[2]);
  state.view = 'day';
  render();
}

function renderMonth() {
  const year = state.selectedDate.getFullYear(), month = state.selectedDate.getMonth();
  const days = daysInRange(monthGridStart(year, month), monthGridEnd(year, month));
  let html = '<div class="month-grid">';
  WEEKDAYS.forEach(wd => { html += `<div class="weekday-header">${wd}</div>`; });
  days.forEach(d => {
    const isOutside = d.getMonth() !== month, isToday = isSameDay(d, state.today);
    const cls = 'month-cell' + (isOutside ? ' outside' : '') + (isToday ? ' today' : '');
    html += `<div class="${cls}" data-date="${toDateKey(d)}"><span class="date-num">${d.getDate()}</span><div class="event-area"></div></div>`;
  });
  html += '</div>';
  container.innerHTML = html;
  container.querySelectorAll('.month-cell').forEach(cell => {
    cell.addEventListener('click', (e) => { if (!e.target.closest('[data-eidx]')) dateClickHandler(cell.dataset.date); });
    const dk = cell.dataset.date, area = cell.querySelector('.event-area');
    getEventsForDate(dk).forEach((ev, i) => { area.innerHTML += workoutCardHTML(ev, 'workout-card', dk, i); });
  });
  attachCardClickHandlers();
}

function renderWeek() {
  const ws = startOfWeek(state.selectedDate);
  const days = []; for (let i = 0; i < 7; i++) days.push(addDays(ws, i));
  let html = '<div class="week-grid"><div class="week-header-spacer"></div>';
  days.forEach(d => {
    const t = isSameDay(d, state.today);
    html += `<div class="week-day-header${t ? ' today' : ''}" data-date="${toDateKey(d)}">${WEEKDAYS[d.getDay()]}<span class="header-date">${d.getDate()}</span></div>`;
  });
  for (let h = HOUR_START; h <= HOUR_END; h++) {
    html += `<div class="week-time-label">${formatHour(h)}</div>`;
    days.forEach(d => { html += `<div class="week-cell${isSameDay(d, state.today) ? ' today-col' : ''}" data-date="${toDateKey(d)}"></div>`; });
  }
  html += '</div>';
  container.innerHTML = html;
  container.querySelectorAll('.week-day-header, .week-cell').forEach(el => {
    if (el.dataset.date) { el.style.cursor = 'pointer'; el.addEventListener('click', (e) => { if (!e.target.closest('[data-eidx]')) dateClickHandler(el.dataset.date); }); }
  });
  injectCardsIntoFirstCell(container, '.week-cell', 'week-workout-card');
  attachCardClickHandlers();
}

function renderThreeDay() {
  if (window.innerWidth <= 480) { renderThreeDayStacked(); return; }
  const days = []; for (let i = 0; i < 3; i++) days.push(addDays(state.selectedDate, i));
  let html = '<div class="threeday-grid"><div class="threeday-header-spacer"></div>';
  days.forEach(d => {
    const t = isSameDay(d, state.today);
    html += `<div class="threeday-day-header${t ? ' today' : ''}" data-date="${toDateKey(d)}">${WEEKDAYS_FULL[d.getDay()]}<span class="header-date">${d.getDate()}</span></div>`;
  });
  for (let h = HOUR_START; h <= HOUR_END; h++) {
    html += `<div class="threeday-time-label">${formatHour(h)}</div>`;
    days.forEach(d => { html += `<div class="threeday-cell${isSameDay(d, state.today) ? ' today-col' : ''}" data-date="${toDateKey(d)}"></div>`; });
  }
  html += '</div>';
  container.innerHTML = html;
  container.querySelectorAll('.threeday-day-header, .threeday-cell').forEach(el => {
    if (el.dataset.date) { el.style.cursor = 'pointer'; el.addEventListener('click', (e) => { if (!e.target.closest('[data-eidx]')) dateClickHandler(el.dataset.date); }); }
  });
  injectCardsIntoFirstCell(container, '.threeday-cell', 'threeday-workout-card');
  attachCardClickHandlers();
}

function renderThreeDayStacked() {
  const days = []; for (let i = 0; i < 3; i++) days.push(addDays(state.selectedDate, i));
  let html = '';
  days.forEach(d => {
    const t = isSameDay(d, state.today);
    html += `<div class="threeday-stack-day"><div class="threeday-day-header${t ? ' today' : ''}" data-date="${toDateKey(d)}" style="border-right:none">${WEEKDAYS_FULL[d.getDay()]}<span class="header-date">${d.getDate()}</span></div>`;
    for (let h = HOUR_START; h <= HOUR_END; h++) {
      html += `<div class="threeday-stack-row"><div class="threeday-time-label">${formatHour(h)}</div><div class="threeday-stack-cell${t ? ' today-col' : ''}" data-date="${toDateKey(d)}"></div></div>`;
    }
    html += '</div>';
  });
  container.innerHTML = html;
  container.querySelectorAll('[data-date]').forEach(el => { el.style.cursor = 'pointer'; el.addEventListener('click', (e) => { if (!e.target.closest('[data-eidx]')) dateClickHandler(el.dataset.date); }); });
  injectCardsIntoFirstCell(container, '.threeday-stack-cell', 'threeday-workout-card');
  attachCardClickHandlers();
}

function renderDay() {
  const d = state.selectedDate, t = isSameDay(d, state.today);
  let html = `<div class="day-view"><div class="day-view-header${t ? ' today' : ''}">${WEEKDAYS_FULL[d.getDay()]}<span class="header-date">${d.getDate()}</span></div>`;
  for (let h = HOUR_START; h <= HOUR_END; h++) {
    html += `<div class="day-hour-row"><div class="day-time-label">${formatHour(h)}</div><div class="day-hour-cell"></div></div>`;
  }
  html += '</div>';
  container.innerHTML = html;
  const dk = toDateKey(d);
  const dayEvts = getEventsForDate(dk);
  const dayView = container.querySelector('.day-view');
  dayEvts.forEach((ev, i) => {
    dayView.insertAdjacentHTML('afterbegin', workoutCardHTML(ev, 'day-workout-card', dk, i));
  });
  attachCardClickHandlers();
}

function navigatePrev() {
  const d = state.selectedDate;
  switch (state.view) {
    case 'month': state.selectedDate = new Date(d.getFullYear(), d.getMonth() - 1, 1); break;
    case 'week': state.selectedDate = addDays(d, -7); break;
    case 'threeday': state.selectedDate = addDays(d, -3); break;
    case 'day': state.selectedDate = addDays(d, -1); break;
  }
  render();
}

function navigateNext() {
  const d = state.selectedDate;
  switch (state.view) {
    case 'month': state.selectedDate = new Date(d.getFullYear(), d.getMonth() + 1, 1); break;
    case 'week': state.selectedDate = addDays(d, 7); break;
    case 'threeday': state.selectedDate = addDays(d, 3); break;
    case 'day': state.selectedDate = addDays(d, 1); break;
  }
  render();
}

function navigateToday() { state.today = localToday(); state.selectedDate = localToday(); render(); }

viewBtns.forEach(btn => btn.addEventListener('click', () => { state.view = btn.dataset.view; render(); }));
prevBtn.addEventListener('click', navigatePrev);
nextBtn.addEventListener('click', navigateNext);
todayBtn.addEventListener('click', navigateToday);
window.addEventListener('resize', () => { if (state.view === 'threeday') render(); });

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function workoutCardHTML(ev, cls, dateKey, evIdx) {
  return `<div class="${cls}" data-date="${dateKey}" data-eidx="${evIdx}"><div class="wc-title">${esc(ev.title)}</div><div class="wc-meta">${ev.durationMinutes}min${ev.targetMiles ? ' · ' + ev.targetMiles + 'mi' : ''} · ${esc(ev.intensity)}</div></div>`;
}

function injectCardsIntoFirstCell(root, cellSelector, cardClass) {
  const seen = {};
  root.querySelectorAll(cellSelector).forEach(cell => {
    const dk = cell.dataset.date;
    if (!dk || seen[dk]) return;
    seen[dk] = true;
    getEventsForDate(dk).forEach((ev, i) => { cell.innerHTML += workoutCardHTML(ev, cardClass, dk, i); });
  });
}

const recommendBtn = document.getElementById('recommendBtn');
const checkinBtn = document.getElementById('checkinBtn');
const modalOverlay = document.getElementById('modalOverlay');
const modalContent = document.getElementById('modalContent');
const readinessSummaryEl = document.getElementById('readinessSummary');
const checkinGateEl = document.getElementById('checkinGate');
let pendingWorkout = null;
let todayReadiness = null;

function showModal(rec) {
  pendingWorkout = rec;
  const trail = rec.trailRecommendation || rec.trail || null;
  let trailHTML = '';
  if (trail) {
    const statusCls = trail.status === 'confirmed_open' ? 'open' : 'unknown';
    trailHTML = `<div class="modal-trail"><strong>Trail:</strong> ${esc(trail.name)}<br><span class="trail-status ${statusCls}">${esc(trail.status)}</span></div>`;
  }
  modalContent.innerHTML = `
    <h3>${esc(rec.title)}</h3>
    <div class="modal-row"><strong>Type:</strong> ${esc(rec.type)}</div>
    <div class="modal-row"><strong>Duration:</strong> ${rec.durationMinutes} min</div>
    ${rec.targetMiles ? `<div class="modal-row"><strong>Mileage:</strong> ${rec.targetMiles} mi</div>` : ''}
    <div class="modal-row"><strong>Intensity:</strong> ${esc(rec.intensity && rec.intensity.target ? rec.intensity.target : JSON.stringify(rec.intensity))}</div>
    ${trailHTML}
    <div class="modal-explanation">${esc(rec.explanation)}</div>
    <div class="modal-actions">
      <button class="modal-accept" id="modalAccept">Accept and Add to Calendar</button>
      <button class="modal-cancel" id="modalCancel">Cancel</button>
    </div>`;
  modalOverlay.classList.add('open');
  document.getElementById('modalAccept').addEventListener('click', () => acceptWorkout());
  document.getElementById('modalCancel').addEventListener('click', () => hideModal());
}

function hideModal() {
  modalOverlay.classList.remove('open');
  pendingWorkout = null;
}

function acceptWorkout() {
  if (!pendingWorkout) return;
  const rec = pendingWorkout;
  const workout = {
    date: rec.date,
    title: rec.title,
    type: rec.type,
    durationMinutes: rec.durationMinutes,
    targetMiles: rec.targetMiles || null,
    intensity: rec.intensity && rec.intensity.target ? rec.intensity.target : String(rec.intensity),
    explanation: rec.explanation || null,
    instructions: rec.instructions || null,
    source: 'coaching_recommendation',
  };
  events.push(workout);
  saveEvents(events);
  hideModal();
  render();
}

async function fetchRecommendation() {
  if (!todayReadiness && !todayHealth) {
    checkinGateEl.textContent = "Complete a Morning Check-In or enter a Health Score before generating a personalized recommendation.";
    checkinGateEl.style.display = 'block';
    return;
  }
  recommendBtn.disabled = true;
  recommendBtn.textContent = 'Loading…';
  try {
    const dateKey = toDateKey(state.today);
    const resp = await fetch('/api/coach/recommend?date=' + dateKey);
    if (!resp.ok) throw new Error('Server error ' + resp.status);
    const data = await resp.json();
    if (data.error) {
      showError(data.error + (data.details ? ': ' + data.details : ''));
      return;
    }
    const rec = data.recommendation;
    if (!rec) { showError('No recommendation returned'); return; }
    showModal(rec);
  } catch (err) {
    showError(err.message);
  } finally {
    recommendBtn.disabled = false;
    recommendBtn.textContent = "Get Today’s Recommendation";
  }
}

function showError(msg) {
  modalContent.innerHTML = `<div class="modal-error">${esc(msg)}</div><div class="modal-actions"><button class="modal-cancel" id="modalCancel">Close</button></div>`;
  modalOverlay.classList.add('open');
  document.getElementById('modalCancel').addEventListener('click', () => hideModal());
}

// ── Workout Details Modal ──

function attachCardClickHandlers() {
  container.querySelectorAll('[data-eidx]').forEach(card => {
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      const dk = card.dataset.date;
      const idx = parseInt(card.dataset.eidx, 10);
      const evts = getEventsForDate(dk);
      if (evts[idx]) showDetailsModal(evts[idx], dk, idx);
    });
  });
}

function showDetailsModal(ev, dateKey, idx) {
  const isStrava = ev.source === 'strava';
  const isReadOnly = isStrava;
  const sourceLabel = isStrava ? 'Strava Import' : (ev.source === 'coaching_recommendation' ? 'Coaching Recommendation' : 'Manual Entry');

  let instructionsHTML = '';
  if (ev.instructions && Array.isArray(ev.instructions) && ev.instructions.length) {
    instructionsHTML = '<div class="modal-instructions"><strong>Instructions:</strong><ol>' +
      ev.instructions.map(s => `<li>${esc(s)}</li>`).join('') + '</ol></div>';
  }

  let explanationHTML = '';
  if (ev.explanation) {
    explanationHTML = `<div class="modal-explanation">${esc(ev.explanation)}</div>`;
  }

  let actionsHTML = '<div class="modal-actions"><button class="modal-cancel" id="detailClose">Close</button>';
  if (!isReadOnly) {
    actionsHTML += '<button class="modal-edit" id="detailEdit">Edit</button>';
    actionsHTML += '<button class="modal-delete" id="detailDelete">Delete</button>';
  }
  actionsHTML += '</div>';

  modalContent.innerHTML = `
    <h3>${esc(ev.title)}</h3>
    <div class="modal-row"><strong>Date:</strong> ${esc(dateKey)}</div>
    <div class="modal-row"><strong>Type:</strong> ${esc(ev.type)}</div>
    <div class="modal-row"><strong>Duration:</strong> ${ev.durationMinutes} min</div>
    ${ev.targetMiles ? `<div class="modal-row"><strong>Mileage:</strong> ${ev.targetMiles} mi</div>` : ''}
    <div class="modal-row"><strong>Intensity:</strong> ${esc(typeof ev.intensity === 'object' ? (ev.intensity.target || JSON.stringify(ev.intensity)) : ev.intensity)}</div>
    ${explanationHTML}
    ${instructionsHTML}
    <div class="modal-source">${esc(sourceLabel)}</div>
    ${actionsHTML}`;
  modalOverlay.classList.add('open');

  document.getElementById('detailClose').addEventListener('click', hideModal);
  if (!isReadOnly) {
    document.getElementById('detailEdit').addEventListener('click', () => editWorkout(ev, dateKey, idx));
    document.getElementById('detailDelete').addEventListener('click', () => deleteWorkout(dateKey, idx));
  }
}

function editWorkout(ev, dateKey, idx) {
  modalContent.innerHTML = `
    <h3>Edit Workout</h3>
    <div class="checkin-form">
      <label>Title</label>
      <input type="text" id="edit_title" value="${esc(ev.title)}">
      <label>Type</label>
      <select id="edit_type">
        <option value="mtb_ride"${ev.type === 'mtb_ride' ? ' selected' : ''}>MTB Ride</option>
        <option value="strength"${ev.type === 'strength' ? ' selected' : ''}>Strength</option>
        <option value="mobility"${ev.type === 'mobility' ? ' selected' : ''}>Mobility</option>
        <option value="recovery"${ev.type === 'recovery' ? ' selected' : ''}>Recovery</option>
        <option value="rest"${ev.type === 'rest' ? ' selected' : ''}>Rest</option>
      </select>
      <label>Duration (minutes)</label>
      <input type="number" id="edit_duration" min="0" value="${ev.durationMinutes || 0}">
      <label>Target Miles</label>
      <input type="number" id="edit_miles" min="0" step="0.5" value="${ev.targetMiles || ''}">
      <label>Intensity</label>
      <input type="text" id="edit_intensity" value="${esc(typeof ev.intensity === 'object' ? (ev.intensity.target || '') : (ev.intensity || ''))}">
      <div class="modal-actions">
        <button class="modal-accept" id="editSave">Save Changes</button>
        <button class="modal-cancel" id="editCancel">Cancel</button>
      </div>
    </div>`;
  document.getElementById('editSave').addEventListener('click', () => {
    const globalIdx = events.findIndex(e => e === ev);
    if (globalIdx === -1) { hideModal(); return; }
    events[globalIdx].title = document.getElementById('edit_title').value.trim() || ev.title;
    events[globalIdx].type = document.getElementById('edit_type').value;
    events[globalIdx].durationMinutes = +document.getElementById('edit_duration').value || 0;
    const miles = document.getElementById('edit_miles').value;
    events[globalIdx].targetMiles = miles ? +miles : null;
    events[globalIdx].intensity = document.getElementById('edit_intensity').value.trim() || ev.intensity;
    saveEvents(events);
    hideModal();
    render();
  });
  document.getElementById('editCancel').addEventListener('click', () => showDetailsModal(ev, dateKey, idx));
}

function deleteWorkout(dateKey, idx) {
  const evts = getEventsForDate(dateKey);
  const target = evts[idx];
  if (!target) { hideModal(); return; }
  const globalIdx = events.findIndex(e => e === target);
  if (globalIdx === -1) { hideModal(); return; }
  events.splice(globalIdx, 1);
  saveEvents(events);
  hideModal();
  render();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalOverlay.classList.contains('open')) hideModal();
});

async function submitCheckin() {
  let valid = true;

  const pain = +document.getElementById('ci_pain').value;
  const painLoc = document.getElementById('ci_painLoc').value.trim();
  const timeMin = +document.getElementById('ci_time').value;

  document.querySelectorAll('.field-error').forEach(el => el.classList.remove('visible'));

  if (pain > 0 && !painLoc) {
    document.getElementById('err_painLoc').classList.add('visible');
    valid = false;
  }
  if (isNaN(timeMin) || timeMin < 0) {
    document.getElementById('err_time').classList.add('visible');
    valid = false;
  }
  if (!valid) return;

  const dateKey = toDateKey(state.today);
  const payload = {
    date: dateKey,
    sleepQuality: +document.getElementById('ci_sleep').value,
    energy: +document.getElementById('ci_energy').value,
    soreness: +document.getElementById('ci_soreness').value,
    pain: pain,
    stress: +document.getElementById('ci_stress').value,
    timeAvailableMinutes: timeMin,
    indoorOutdoor: document.getElementById('ci_indoor').value,
    currentLocation: document.getElementById('ci_location').value.trim() || null,
    notes: document.getElementById('ci_notes').value.trim() || null,
  };
  if (pain > 0) payload.painLocation = painLoc;

  const submitBtn = document.getElementById('ciSubmit');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving…';

  try {
    const resp = await fetch('/api/coach/checkin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    if (!resp.ok) {
      const errEl = document.getElementById('err_general');
      errEl.textContent = data.error || 'Save failed';
      errEl.classList.add('visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Save Check-In';
      return;
    }
    todayReadiness = data;
    renderReadinessSummary();
    updateCheckinButton();
    hideModal();
  } catch (err) {
    const errEl = document.getElementById('err_general');
    errEl.textContent = err.message;
    errEl.classList.add('visible');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Save Check-In';
  }
}

function renderReadinessSummary() {
  if (!todayReadiness) {
    readinessSummaryEl.innerHTML = '';
    return;
  }
  const r = todayReadiness.readiness;
  const c = todayReadiness.checkin;
  let warningHTML = '';
  if (r.score < 30) warningHTML = `<div class="rs-warning">Rest recommended — very low readiness</div>`;
  else if (r.score < 50) warningHTML = `<div class="rs-warning">Reduce intensity today</div>`;
  if (c.pain && c.pain >= 7) warningHTML = `<div class="rs-warning">Significant pain reported — rest or seek evaluation</div>`;
  readinessSummaryEl.innerHTML = `
    <div class="readiness-summary">
      <span class="rs-score">${r.score}/100</span>
      <span class="rs-label">${esc(r.label)}</span>
      ${warningHTML}
      <div class="rs-date">Check-in: ${esc(c.date)}</div>
    </div>`;
  checkinGateEl.style.display = 'none';
}

function updateCheckinButton() {
  if (todayReadiness) {
    checkinBtn.classList.add('done');
    checkinBtn.textContent = '✓ Checked In';
  } else {
    checkinBtn.classList.remove('done');
    checkinBtn.textContent = 'Morning Check-In';
  }
}

async function loadTodayReadiness() {
  const dateKey = toDateKey(localToday());
  try {
    const resp = await fetch('/api/coach/checkin/' + dateKey);
    if (resp.ok) {
      todayReadiness = await resp.json();
      renderReadinessSummary();
      updateCheckinButton();
    } else {
      todayReadiness = null;
      updateCheckinButton();
    }
  } catch { todayReadiness = null; }
}

checkinBtn.addEventListener('click', () => {
  if (todayReadiness) return;
  showCheckinForm();
});
recommendBtn.addEventListener('click', fetchRecommendation);
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) hideModal(); });

// ── Health Score ──

const healthBtn = document.getElementById('healthBtn');
const healthSummaryEl = document.getElementById('healthSummary');
let todayHealth = null;

function showHealthForm(prefill) {
  const today = toDateKey(localToday());
  const rec = prefill || {};
  modalContent.innerHTML = `
    <h3>Today's Athlytic Health Score</h3>
    <div class="health-form" id="healthForm">
      <label>Recovery % (0–100)</label>
      <input type="number" id="hs_recovery" min="0" max="100" step="1" value="${rec.recovery != null ? rec.recovery : ''}">
      <div class="field-error" id="err_recovery">Recovery must be 0–100</div>

      <label>Sleep % (0–100)</label>
      <input type="number" id="hs_sleep" min="0" max="100" step="1" value="${rec.sleep != null ? rec.sleep : ''}">
      <div class="field-error" id="err_sleep">Sleep must be 0–100</div>

      <label>Exertion (0–10)</label>
      <input type="number" id="hs_exertion" min="0" max="10" step="0.1" value="${rec.exertion != null ? rec.exertion : ''}">
      <div class="field-error" id="err_exertion">Exertion must be 0–10</div>

      <label>Screenshot (optional — JPG, PNG, HEIC)</label>
      <input type="file" id="hs_screenshot" accept=".jpg,.jpeg,.png,.heic">

      <label>Date</label>
      <input type="date" id="hs_date" value="${rec.date || today}">

      <div class="field-error" id="err_hs_general" style="margin-top:10px"></div>

      <div class="modal-actions">
        <button class="modal-accept" id="hsSubmit">Save Health Score</button>
        <button class="modal-cancel" id="hsCancel">Cancel</button>
      </div>
    </div>`;
  modalOverlay.classList.add('open');
  document.getElementById('hsSubmit').addEventListener('click', submitHealthScore);
  document.getElementById('hsCancel').addEventListener('click', hideModal);
}

async function submitHealthScore() {
  document.querySelectorAll('.field-error').forEach(el => el.classList.remove('visible'));
  let valid = true;

  const recovery = parseFloat(document.getElementById('hs_recovery').value);
  const sleep = parseFloat(document.getElementById('hs_sleep').value);
  const exertion = parseFloat(document.getElementById('hs_exertion').value);
  const hsDate = document.getElementById('hs_date').value;
  const fileInput = document.getElementById('hs_screenshot');

  if (isNaN(recovery) || recovery < 0 || recovery > 100) {
    document.getElementById('err_recovery').classList.add('visible'); valid = false;
  }
  if (isNaN(sleep) || sleep < 0 || sleep > 100) {
    document.getElementById('err_sleep').classList.add('visible'); valid = false;
  }
  if (isNaN(exertion) || exertion < 0 || exertion > 10) {
    document.getElementById('err_exertion').classList.add('visible'); valid = false;
  }
  if (!valid) return;

  const submitBtn = document.getElementById('hsSubmit');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Saving…';

  try {
    let hasScreenshot = false;
    if (fileInput.files.length > 0) {
      const form = new FormData();
      form.append('file', fileInput.files[0]);
      form.append('date', hsDate);
      const upResp = await fetch('/api/coach/health/upload', { method: 'POST', body: form });
      if (upResp.ok) hasScreenshot = true;
    }

    const payload = { date: hsDate, recovery, sleep, exertion, hasScreenshot };
    const resp = await fetch('/api/coach/health', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await resp.json();
    if (!resp.ok) {
      const errEl = document.getElementById('err_hs_general');
      errEl.textContent = data.error || 'Save failed';
      errEl.classList.add('visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Save Health Score';
      return;
    }

    todayHealth = data;
    renderHealthSummary();
    updateHealthButton();
    updateReadinessWithHealth();
    hideModal();
  } catch (err) {
    const errEl = document.getElementById('err_hs_general');
    errEl.textContent = err.message;
    errEl.classList.add('visible');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Save Health Score';
  }
}

function renderHealthSummary() {
  if (!todayHealth || !todayHealth.health) {
    healthSummaryEl.innerHTML = '';
    return;
  }
  const h = todayHealth.health;
  healthSummaryEl.innerHTML = `
    <div class="health-summary" id="healthSummaryCard">
      <span class="hs-label">Athlytic: Recovery ${h.recovery}% &bull; Sleep ${h.sleep}% &bull; Exertion ${h.exertion.toFixed(1)}</span>
      <div class="hs-date">${esc(h.date)}</div>
    </div>`;
  document.getElementById('healthSummaryCard').addEventListener('click', () => {
    showHealthForm(todayHealth.health);
  });
}

function updateHealthButton() {
  if (todayHealth) {
    healthBtn.classList.add('done');
    healthBtn.textContent = '✓ Health Score';
  } else {
    healthBtn.classList.remove('done');
    healthBtn.textContent = 'Enter Health Score';
  }
}

function updateReadinessWithHealth() {
  if (!todayHealth) return;
  const hr = todayHealth.readiness;
  if (hr && hr.score != null) {
    checkinGateEl.style.display = 'none';

    if (todayReadiness) {
      const blended = Math.round(hr.score * 0.6 + todayReadiness.readiness.score * 0.4);
      todayReadiness.readiness.score = blended;
      todayReadiness.readiness.label = hr.label;
      renderReadinessSummary();
    } else {
      readinessSummaryEl.innerHTML = `
        <div class="readiness-summary">
          <span class="rs-score">${hr.score}/100</span>
          <span class="rs-label">${esc(hr.label)}</span>
          <div class="rs-date">Source: Athlytic Health Score</div>
        </div>`;
    }
  }
}

async function loadTodayHealth() {
  const dateKey = toDateKey(localToday());
  try {
    const resp = await fetch('/api/coach/health/' + dateKey);
    if (resp.ok) {
      todayHealth = await resp.json();
      renderHealthSummary();
      updateHealthButton();
      updateReadinessWithHealth();
    } else {
      todayHealth = null;
      updateHealthButton();
    }
  } catch { todayHealth = null; }
}

healthBtn.addEventListener('click', () => {
  showHealthForm(todayHealth ? todayHealth.health : null);
});

loadTodayHealth();
loadTodayReadiness();
render();
  </script>
</body>
</html>
